[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classroom-console"
version = "0.1.0"
description = "Classroom management system (teacher console + student agents), NetSupport-style"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9",
    "mss>=9.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pyinstaller>=6.0"]

[project.scripts]
# Installed as command-line programs after `pip install .`
classroom-hub = "hub.server:main"
classroom-student = "student.agent:main"

[tool.setuptools]
packages = ["hub", "student", "teacher", "shared"]

[tool.setuptools.package-data]
# Ship the web console assets inside the package.
teacher = ["static/*"]
